name: release-ally

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag (e.g. ally-v1)
        type: string
        default: ally-v1
      publish_release:
        description: Publish the binaries as a GitHub Release
        type: boolean
        default: true
  push:
    tags:
      - "ally-v*"

permissions:
  contents: read

env:
  WINDOWS_LLVM_VERSION: "22.1.8"
  WINDOWS_LLVM_SHA256: "16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c"
  PGO_PROFILE: "lichii-windows.profdata"

concurrency:
  group: release-ally-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare Ally release metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version_label: ${{ steps.meta.outputs.version_label }}
      should_publish: ${{ steps.meta.outputs.should_publish }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Determine tag and version
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_PUBLISH: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            should_publish="true"
          else
            tag="${INPUT_TAG:-ally-v1}"
            should_publish="${INPUT_PUBLISH:-true}"
          fi

          if [[ "$tag" =~ ^ally-(v.+)$ ]]; then
            version_label="${BASH_REMATCH[1]}"
          else
            ally_num="$(tr -d '[:space:]' < dist/ally_version.txt)"
            version_label="v${ally_num}"
          fi

          if [[ "$should_publish" == "true" && "${GITHUB_REF}" != refs/tags/* ]]; then
            if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag" >/dev/null 2>&1; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version_label=$version_label" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"

  build:
    name: Windows ${{ matrix.variant }} (PGO + ThinLTO)
    needs: prepare-release
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Xbox-Ally-X-AVX512
            preset: v4
          - variant: Universal-AVX2
            preset: v3

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Verify Windows PGO profile
        shell: bash
        run: |
          set -euo pipefail
          test -s "$PGO_PROFILE"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM clang-cl on Windows
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'llvm.exe'
          Invoke-WebRequest -OutFile $installer "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:WINDOWS_LLVM_VERSION/LLVM-$env:WINDOWS_LLVM_VERSION-win64.exe"
          if ((Get-FileHash -Algorithm SHA256 $installer).Hash -ne $env:WINDOWS_LLVM_SHA256) {
            throw 'LLVM installer checksum mismatch'
          }
          $root = Join-Path $env:RUNNER_TEMP 'llvm'
          Start-Process -Wait -FilePath $installer -ArgumentList '/S', "/D=$root"
          $version = & "$root/bin/clang-cl.exe" --version
          $version
          if (-not ($version -match "clang version $([regex]::Escape($env:WINDOWS_LLVM_VERSION))")) {
            throw "Unexpected clang-cl: $version"
          }
          "LLVM_ROOT=$($root.Replace('\', '/'))" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Install Qt 6.8.3 on Windows
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install sccache on Windows
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK on Windows
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools on Windows
        shell: pwsh
        run: glslangValidator --version

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-ally-win-v1-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-ally-win-v1-

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: .sccache
          key: objects-ally-${{ matrix.preset }}-${{ hashFiles('lichii-windows.profdata') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-ally-${{ matrix.preset }}-${{ hashFiles('lichii-windows.profdata') }}-${{ github.sha }}-
            objects-ally-${{ matrix.preset }}-${{ hashFiles('lichii-windows.profdata') }}-

      - name: Configure Lichii Ally (${{ matrix.variant }})
        shell: bash
        run: |
          set -euo pipefail
          flags="-DWIN32 -D_WINDOWS -DNOMINMAX -flto=thin"
          flags+=" -fprofile-use=$(cygpath -m "$PWD/$PGO_PROFILE")"
          flags+=" -Wno-error=profile-instr-out-of-date -Wno-error=profile-instr-unprofiled"
          flags+=" -Wno-error=backend-plugin"
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DYUZU_BUILD_PRESET=${{ matrix.preset }} \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe" \
            "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe" \
            "-DCMAKE_C_FLAGS=$flags" \
            "-DCMAKE_CXX_FLAGS=-EHsc $flags"

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build Lichii Ally (${{ matrix.variant }})
        shell: bash
        run: |
          set -euo pipefail
          sccache --zero-stats
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          sccache --show-stats

      - name: Stop sccache
        if: always() && steps.compiler-cache.outcome == 'success'
        shell: pwsh
        run: sccache --stop-server

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: .sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Package Lichii Ally zip and debug symbols
        shell: pwsh
        env:
          VERSION_LABEL: ${{ needs.prepare-release.outputs.version_label }}
          VARIANT: ${{ matrix.variant }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($exe in 'lichii.exe', 'eden-cli.exe') {
            if (-not (Test-Path "build/release/bin/$exe")) {
              throw "build/release/bin/$exe was not produced"
            }
          }

          windeployqt --release --no-translations build/release/bin/lichii.exe

          New-Item -ItemType Directory -Force -Path stage/Lichii-Ally, stage/symbols, out | Out-Null
          Copy-Item -Path build/release/bin/* -Destination stage/Lichii-Ally -Recurse -Force

          Get-ChildItem -Path stage/Lichii-Ally -Filter '*.pdb' -Recurse | ForEach-Object {
            Move-Item -Path $_.FullName -Destination stage/symbols -Force
          }

          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' `
            -OutFile 'stage/Lichii-Ally/vc_redist.x64.exe'

          $mainZip = "out/Lichii-Ally-$env:VERSION_LABEL-$env:VARIANT.zip"
          $pdbZip  = "out/Lichii-Ally-$env:VERSION_LABEL-$env:VARIANT-debug-symbols-not-needed-to-play.zip"

          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            7z a -tzip -mx=7 $mainZip ./stage/Lichii-Ally | Out-Null
            if ((Get-ChildItem stage/symbols).Count -gt 0) {
              7z a -tzip -mx=7 $pdbZip ./stage/symbols/* | Out-Null
            }
          } else {
            Compress-Archive -Path stage/Lichii-Ally -DestinationPath $mainZip -CompressionLevel Optimal
            if ((Get-ChildItem stage/symbols).Count -gt 0) {
              Compress-Archive -Path stage/symbols/* -DestinationPath $pdbZip -CompressionLevel Optimal
            }
          }
          Get-ChildItem out | Format-Table Name, Length

      - name: Upload packaged zips
        uses: actions/upload-artifact@v7
        with:
          name: lichii-ally-${{ matrix.variant }}
          path: out/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: [prepare-release, build]
    if: needs.prepare-release.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged zips
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION_LABEL: ${{ needs.prepare-release.outputs.version_label }}
        run: |
          set -euo pipefail
          ls -lh artifacts

          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          avx512_zip="Lichii-Ally-${VERSION_LABEL}-Xbox-Ally-X-AVX512.zip"
          avx2_zip="Lichii-Ally-${VERSION_LABEL}-Universal-AVX2.zip"

          sed 's/^          //' > notes.md <<EOF
          ## [Download Lichii Ally ${VERSION_LABEL} — ASUS ROG Xbox Ally X / Ally X (AVX-512 + PGO)](${base}/${avx512_zip})

          **Edição Universal (ROG Xbox Ally Base Z2 A / Steam Deck Windows / PCs sem AVX-512):** [Download ${avx2_zip}](${base}/${avx2_zip})

          ---

          ### Português — Instalação e Uso
          1. Baixe **${avx512_zip}** acima, extraia a pasta **\`Lichii-Ally\`** e execute **\`lichii.exe\`**. *(Caso o Windows solicite bibliotecas C++, execute o instalador \`vc_redist.x64.exe\` incluído na pasta.)*
          2. Instale suas chaves (*keys*) e *firmware* do console e adicione o diretório dos seus jogos.
          3. Todas as otimizações específicas para o **ASUS ROG Xbox Ally X** (escalonamento híbrido Zen 5 + Zen 5c, orçamento de memória para 24 GB RAM, limite de 6 threads assíncronas de shaders, AMD FSR 3.1 automático, Tela Cheia Sem Bordas e alvo de **40 FPS** com Genlock em 120 Hz VRR) já estão habilitadas por padrão.

          #### Configurações Recomendadas no Armoury Crate SE (ROG Xbox Ally X)
          - **VRAM:** **8 GB** (preserva 16 GB livres para o Windows, JIT e compilação de shaders).
          - **Tela:** **1080p @ 120 Hz** com **AMD FreeSync Premium (VRR) Ativado** *(desative Radeon Anti-Lag, Radeon Boost e AFMF no AMD Software)*.
          - **Perfil de Energia (TDP):** **17W–20W** para **40 FPS** na bateria, **25W–30W** para **60 FPS**, ou **13W–15W** para **30 FPS**.

          #### Atalhos de Controle (compatíveis com Xbox Full Screen Experience)
          - **\`View + R3\`** *(ou \`F7\` / botão na barra inferior)*: Alterna em tempo real entre **40 FPS, 60 FPS e 30 FPS**.
          - **\`View + L3\`** *(ou \`F11\`)*: Alterna Tela Cheia Sem Bordas.
          - **\`Menu + R3\`** *(ou \`Ctrl + V\`)*: Exibe ou oculta o Overlay de Desempenho.

          ---

          ### English — Quick Start
          1. Download **${avx512_zip}** above (recommended for **ASUS ROG Xbox Ally X**, **ROG Ally X**, and **ROG Ally Z1 Extreme**), extract **\`Lichii-Ally\`**, and run **\`lichii.exe\`**. *(For the base **ROG Xbox Ally** with Ryzen Z2 A or non-AVX-512 systems, use **${avx2_zip}**.)*
          2. Install your legally dumped keys and firmware, then select your games directory. All handheld optimizations (\`clang-cl\` 22 ThinLTO + PGO + \`znver5\` AVX-512, Windows 11 Zen 5 / Zen 5c core scheduling, 24 GB APU memory tuning, capped async shader workers, automatic DLSS to AMD FSR 3.1 replacement, Borderless Fullscreen, and **40 FPS** 120 Hz VRR Genlock) are enabled out of the box.
          3. Switch target frame rate live in-game anytime with **\`View + R3\`**, **\`F7\`**, or the status bar selector (**40 / 60 / 30 FPS**).

          *(Files ending in \`-debug-symbols-not-needed-to-play.zip\` contain \`.pdb\` symbols for crash analysis only and are not required to play.)*
          EOF

          title="Lichii Ally ${VERSION_LABEL} — ROG Xbox Ally X Edition"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${title}" --notes-file notes.md
            gh release upload "${TAG}" artifacts/*.zip --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" artifacts/*.zip \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${title}" \
              --notes-file notes.md
          fi
